openapi: 3.0.3

info:
  title: Investment Instruction API
  version: 1.0.0
  description: |
    API for submitting investment instructions and retrieving
    their current financial processing status. The instruction endpoints do not expose
    generated orders, trades, or per-asset execution details.

    ## Conventions

    - **Monetary unit.** Every monetary value in this API (`amount`,
      `price`, `lastMarketPrice`, `cashBalance`,
      `value`) is an integer number of **Iranian Rial (IRR)**.
      Toman is never used.
    - **Money identity.** For an account, `value`
      equals `cashBalance` plus the sum of `quantity × lastMarketPrice` over
      its assets.
    - **Timestamps.** `date-time` values are ISO 8601 in **UTC** (suffix `Z`).
    - **Identifiers.** `instructionBatchId` groups a batch, and each
      `instructionId` is unique across all clients.
      `portfolioId` identifies the portfolio affected by an instruction.

    ## Asynchronous processing

    Instructions are submitted through `POST /instruction-batches` and are
    processed asynchronously. A valid batch receives HTTP 201 with no response
    body; it does not mean processing has finished. No push mechanism
    (webhooks or callbacks) exists. Clients can track batch-level status with
    `GET /instruction-batches/{instructionBatchId}`, instruction-level status
    with `GET /instruction-batches/{instructionBatchId}/instructions/{instructionId}`, and every
    instruction of a portfolio with `GET /instructions?portfolioId={portfolioId}`.

    Processing has three stages:

    1. **Execute.** Each instruction is validated. Valid instructions are
       stored and sent for execution (`EXECUTED`); their cash movement is
       recorded as a draft. Invalid instructions are not executed; their
       reasons are returned in `errors`.
    2. **Approve or reject.** The operations team reviews the batch. Approval
       records its financial effect provisionally (`APPROVED`); rejection
       withdraws it and nothing is recorded (`REJECTED`).
    3. **Finalize.** When the business day is closed, the approved
       instructions of that day become `FINALIZED`: the final approval.
       A finalized instruction or batch can no longer change in any way.

    ## Instruction status lifecycle

    | Instruction status | Meaning | Terminal |
    |---|---|---|
    | `EXECUTED` | Validated, stored and sent for execution; waiting for review. | No |
    | `APPROVED` | Approved by operations; the financial effect is recorded provisionally. | No |
    | `REJECTED` | Rejected by operations; no financial effect remains. | Yes |
    | `FINALIZED` | Final approval at the close of the business day; the financial effect is final and cannot change. | Yes |

    There is no `COMPLETED` instruction status; `FINALIZED` is the only
    status that means the instruction is done for good.

    An instruction that fails validation is never executed and has no status.
    `GET /instruction-batches/{instructionBatchId}/instructions/{instructionId}` still returns it,
    without `statusCode`, and with the failure reasons in `errors`.

    | From | To | Trigger |
    |---|---|---|
    | — | `EXECUTED` | The instruction passes validation. |
    | `EXECUTED` | `APPROVED` | Operations approves the batch. |
    | `EXECUTED`, `APPROVED` | `REJECTED` | Operations rejects the batch. |
    | `APPROVED` | `FINALIZED` | The business day is closed. |

    ## Batch status lifecycle

    | Batch status | Meaning | Terminal |
    |---|---|---|
    | `PENDING` | Accepted and stored; validation has not finished yet. | No |
    | `EXECUTING` | Every instruction passed validation and was executed; waiting for review. | No |
    | `PARTIALLY_COMPLETED` | Some instructions were executed, others failed validation (see `errors`); waiting for review. | No |
    | `FAILED` | No instruction passed validation; nothing was executed (see `errors`). | Yes |
    | `APPROVED` | Operations approved the executed instructions. | No |
    | `REJECTED` | Operations rejected the executed instructions. | Yes |
    | `FINALIZED` | Final approval at the close of the business day; cannot change. | Yes |

    There is no `COMPLETED` batch status. `EXECUTING`, `PARTIALLY_COMPLETED`
    and `FAILED` describe validation only; they say nothing about whether the
    financial effect is recorded. That is known only from `APPROVED`,
    `REJECTED` and `FINALIZED`. A batch moves from `PENDING` to `EXECUTING`,
    `PARTIALLY_COMPLETED` or `FAILED`; then to `APPROVED` or `REJECTED`; and
    from `APPROVED` to `FINALIZED`. Batch and instruction statuses move
    together from approval on.

    ## Withdrawals and debt

    A DIVEST records a withdrawal. When the amount is larger than the
    portfolio's cash, the cash goes to zero and the rest is recorded as
    **debt**. While a portfolio has debt:

    - every later INVEST, and the proceeds of every sale, pays the debt first;
      only what is left is added to the cash;
    - the portfolio cannot buy any asset.

    A DIVEST fails validation only when the portfolio's net market value
    (`marketValue + cashValue - debt`) is zero or negative. The current debt
    is returned by `GET /portfolios/{portfolioId}/net-market-value`.

    ## Models

    A model defines a set of assets and their target weights. This version
    of the API has no model-discovery endpoint. A model ID in a request must
    refer to an existing model, otherwise `INVESTMENT_PLAN_NOT_FOUND` is returned.

    ## Errors

    - `POST /instruction-batches` returns **HTTP 400** when the batch
      request itself is malformed. Processing errors for an individual
      instruction are exposed by the instruction lookup response. Reuse of
      an existing instruction or batch identifier is not allowed.
    - JSON Schema violations map to specific codes where one exists:
      a missing `amount` for INVEST or DIVEST → `AMOUNT_REQUIRED`;
      an `amount` below 1 → `INVALID_AMOUNT`. Every other
      schema violation (malformed JSON, a wrong type, a missing required
      field, an unknown property, an unknown enum value) →
      `INVALID_REQUEST`.
    - On GET endpoints, an invalid path or query parameter (non-numeric
      or below 1, a malformed `date-time`, or `from` later than `to`)
      returns HTTP 400 with `INVALID_REQUEST`.
    - The gateway can return these responses on any endpoint: 401
      (missing or invalid credentials), 403 (the client may not access
      the requested investment account), 429 (too many requests),
      500 (unexpected error) and 503 (temporarily unavailable).
      Their bodies are not guaranteed to follow `ErrorResponse`. Retry 429
      and 503 with backoff. After a 500 or a timeout on
      `POST /instruction-batches`, the outcome of individual items may be
      unknown: reconcile accepted items with
      `GET /instruction-batches/{instructionBatchId}/instructions/{instructionId}` (see
      *Retries and idempotency*).
    - `ErrorResponse` has no trace ID and no per-field details. When
      reporting a problem, include the `code`, the request timestamp (UTC)
      and the related `instructionId`, `portfolioId`, or `investmentId`.

    ## Retries and idempotency

    Both `instructionBatchId` and `instructionId` must be unique and must
    not be reused for a new request. `instructionId` must be globally unique
    across all clients and must never be reused, even after the instruction
    is terminal. Reusing an existing `instructionId` is rejected with
    `DUPLICATE_INSTRUCTION`. Reusing an existing `instructionBatchId` is also
    not allowed; the specific error code for a duplicate batch ID is not
    specified in this document.

    After a timeout or a 5xx on `POST /instruction-batches`, do not blindly
    submit the same batch again with the same identifiers. Reconcile the
    outcome by calling `GET /instruction-batches/{instructionBatchId}` and
    `GET /instruction-batches/{instructionBatchId}/instructions/{instructionId}` for the submitted
    identifiers before creating a new request with new unique identifiers.

    ## Cancellation and known limitations

    - There is currently no public API to cancel or edit a submitted batch.
      Until the business day is closed, the operations team can reject an
      executed or approved batch through an internal process (`REJECTED`);
      this is not a client-accessible cancellation operation. A `FINALIZED`
      batch cannot be rejected.
    - Instruction endpoints expose only instruction-level status; generated
      orders, trades, and per-asset execution details are intentionally not returned.
    - `GET /instructions?portfolioId={portfolioId}` lists the executed
      instructions of a portfolio. Instructions that failed validation were
      never executed and do not appear there; look them up by
      `instructionBatchId` and `instructionId`.
    - The maximum recommended/accepted number of instructions per batch has
      not yet been agreed and is intentionally left unspecified.
    - `GET /portfolios/{portfolioId}/net-market-value` returns the current
      market-value breakdown (`marketValue`, `cashValue`, `debt`, and
      `netValue = marketValue + cashValue - debt`) and can be consulted
      before initiating a withdrawal. The response is a valuation snapshot;
      it does not reserve funds or guarantee that a later DIVEST instruction
      will succeed.

servers:
  - url: https://vestapi.emofid.com/bimehma/api/v1
    description: Production
  - url: https://vestapi-sandbox.emofid.com/bimehma/api/v1
    description: Sandbox

security:
  - bearerAuth: []

paths:

  /instruction-batches:
    post:
      operationId: submitInstructionBatch
      summary: Submit a batch of investment instructions
      description: |
        Submits one or more instructions of the batch's `instructionType` in
        a single request. `sumInvest` and `sumDivest` provide the batch totals.
        Each instruction is validated and processed independently; the failure
        or rejection of one instruction does not prevent the others from being
        accepted. A batch containing a single instruction is valid.
        `instructionBatchId` and every `instructionId` must be unique and must
        not be reused. `PARTIALLY_COMPLETED` is meaningful only for the batch,
        not for an individual instruction. See *Errors* and
        *Retries and idempotency* for submission and retry rules.

        A valid batch is accepted with HTTP status 201 and no response body.

        HTTP 400 is only returned when the batch request itself is
        malformed (for example, invalid JSON or a missing or empty
        `instructions` array); it does not reflect the outcome of any
        individual instruction.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionBatchRequest'

            example:
              instructionBatchId: 600004
              instructionType: INVEST
              sumInvest: 15594
              sumDivest: 0
              instructions:

                - instructionId: 10499909
                  portfolioId: 209999
                  amount: 8643
                  modelCode: 100000

                - instructionId: 105000012
                  portfolioId: 210000
                  amount: 6951
                  modelCode: 100000

      responses:

        '201':
          description: Created

        '400':
          description: >
            The batch request itself is malformed. Covers schema
            validation errors of the request body, such as a missing or
            empty instructions array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INVALID_REQUEST
                message: instructions must be a non-empty array.

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /instruction-batches/{instructionBatchId}:
    get:
      operationId: getInstructionBatch
      summary: Get instruction batch status
      description: >
        Returns the current batch-level status. No generated order or execution
        detail is returned. An invalid instructionBatchId returns HTTP 400 with
        INVALID_REQUEST.

      parameters:

        - name: instructionBatchId
          in: path
          required: true
          description: Unique identifier of the instruction batch
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Instruction batch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionBatchResponse'

              example:
                instructionBatchId: 600001
                statusId: 235
                statusCode: APPROVED
                statusDescription: Approved
                creationTime: '2026-09-27T10:15:00Z'
                updateTime: '2026-09-27T10:16:00Z'
                errors: []

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Instruction Batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INSTRUCTION_BATCH_NOT_FOUND
                message: Instruction batch with the specified instructionBatchId does not exist.

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /instruction-batches/{instructionBatchId}/instructions/{instructionId}:
    get:
      operationId: getInstruction
      summary: Get instruction details and execution status
      description: >
        Returns the submitted instruction fields and its current instruction-level
        status. Generated orders, trades, and per-asset execution details are not
        returned. An invalid instructionId returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: instructionBatchId
          in: path
          required: true
          description: Identifier of the batch containing the instruction
          schema:
            type: integer
            format: int64
            minimum: 1

        - name: instructionId
          in: path
          required: true
          description: Unique identifier of the instruction
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Instruction details and current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionChildResponse'

              example:
                instructionBatchId: 600001
                instructionId: 100001
                portfolioId: 200001
                instructionType: INVEST
                amount: 50000000
                modelCode: 300002
                statusCode: APPROVED
                creationTime: '2026-09-27T10:15:00Z'
                updateTime: '2026-09-27T10:16:00Z'
                errors: []

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Instruction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INSTRUCTION_NOT_FOUND
                message: Instruction with the specified instructionId does not exist.

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /instructions:
    get:
      operationId: getPortfolioInstructions
      summary: List the instructions of a portfolio
      description: >
        Returns every executed instruction of the portfolio, each with its
        current status and errors. With `instructionBatchId`, only the
        instructions of that batch are returned. Instructions that
        failed validation were never executed and are not listed. A portfolio
        with no instructions returns an empty array. A missing or invalid
        portfolioId, or an invalid instructionBatchId, returns HTTP 400 with
        INVALID_REQUEST.

      parameters:

        - name: portfolioId
          in: query
          required: true
          description: Identifier of the portfolio
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 200001

        - name: instructionBatchId
          in: query
          required: false
          description: >
            Identifier of a batch. Optional; when given, only the
            instructions of that batch are returned.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 600001

      responses:

        '200':
          description: Instructions of the portfolio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstructionChildResponse'

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /portfolios/{portfolioId}/details:
    get:
      operationId: getPortfolioDetails
      summary: Get portfolio details
      description: >
        Returns the portfolio's default model, cash balance, and asset
        holdings as of the end of a closed business day. With `dayKey`, the
        figures are those of that day; without it, they are those of the
        latest closed business day. All monetary values are in Rial. An
        invalid portfolioId or dayKey returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
            minimum: 1

        - name: dayKey
          in: query
          required: false
          description: >
            Business day to report, as `yyyyMMdd` in the Gregorian calendar
            (for example `20260729`). Optional; when omitted, the latest
            closed business day is used.
          schema:
            type: integer
            format: int32
            example: 20260729

      responses:

        '200':
          description: Portfolio details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioDetailsResponse'

              example:
                portfolioId: 112910912784151
                modelCode: 300002
                cashBalance: 5000000
                value: 45100000
                assets:
                  - isin: IRTKMOFD0001
                    symbol: عیار
                    quantity: 1500
                    lastMarketPrice: 13400

                  - isin: IRT3TVAF0001
                    symbol: توان
                    quantity: 800
                    lastMarketPrice: 25000
                timestamp: '2026-09-27T10:15:00Z'

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /portfolios/{portfolioId}/net-market-value:
    get:
      operationId: getPortfolioNetMarketValue
      summary: Get portfolio net market value
      description: >
        Returns the current net market value breakdown for the portfolio.
        An invalid portfolioId returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 12222122

      responses:

        '200':
          description: Current portfolio net market value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioNetMarketValueResponse'

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /portfolio-transaction/{portfolioId}/transactions:
    get:
      operationId: getPortfolioTransactions
      summary: Get transactions for a portfolio within a date range
      description: >
        Returns the requested page of portfolio transactions between the from
        and to date-times, sorted by timestamp ascending. A missing or malformed
        parameter, from later than to, or an invalid portfolioId returns HTTP
        400 with INVALID_REQUEST.

      parameters:

        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
            minimum: 1

        - name: from
          in: query
          required: true
          description: >
            Start of the date range (inclusive), as an ISO 8601 date-time.
            Must not be later than to.
          schema:
            type: string
            format: date-time
            example: '2026-10-01T00:00:00Z'

        - name: to
          in: query
          required: true
          description: >
            End of the date range (inclusive), as an ISO 8601 date-time.
            Must not be earlier than from.
          schema:
            type: string
            format: date-time
            example: '2026-10-12T23:59:59Z'

        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            example: 0

        - name: pageSize
          in: query
          required: false
          description: Number of transactions to return per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 20
            default: 10
            example: 10

      responses:

        '200':
          description: Portfolio transactions within the specified date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioTransactionResponse'

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:

    InvalidRequest:
      description: A path, query, or request-body value is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_REQUEST
            message: The request contains an invalid value.

    Unauthorized:
      description: Authentication credentials are missing or invalid.

    Forbidden:
      description: The authenticated client cannot access the requested resource.

    TooManyRequests:
      description: Too many requests. Retry with backoff.

    InternalServerError:
      description: An unexpected server error occurred.

    ServiceUnavailable:
      description: The service is temporarily unavailable. Retry with backoff.

  schemas:

    InstructionRequest:
      type: object

      required:
        - instructionId
        - portfolioId
        - amount
        - modelCode

      properties:

        instructionId:
          type: integer
          format: int64
          description: >
            Client-generated unique identifier of the instruction. It acts
            as the idempotency key.

            It must be globally unique across all clients. Reusing an
            existing instructionId is not allowed and returns
            DUPLICATE_INSTRUCTION, whatever the payload. After a
            DUPLICATE_INSTRUCTION on a retry, call
            GET /instruction-batches/{instructionBatchId}/instructions/{instructionId} to check
            whether the original request succeeded.

        portfolioId:
          type: integer
          format: int64
          description: >
            Identifier of the portfolio.

            For DIVEST instructions, the portfolio must already exist.

            For INVEST instructions, a new portfolio is created with this
            identifier if it does not exist; modelCode is then required.

        amount:
          type: integer
          format: int64
          description: >
            Monetary amount of the instruction, in Rial.

            INVEST: cash deposit to record in the portfolio.

            DIVEST: withdrawal to record in the portfolio. Any part larger
            than the portfolio's cash is recorded as debt (see *Withdrawals
            and debt*). The instruction fails validation only when the
            portfolio's net market value is zero or negative.


        modelCode:
          type: integer
          format: int64
          description: >
            Code of the portfolio's default investment model.
            This field is required by the backoffice request contract.


    InstructionChildErrorResponse:
      type: object
      properties:
        instructionBatchId:
          type: integer
          format: int64
        instructionId:
          type: integer
          format: int64
        portfolioId:
          type: integer
          format: int64
        errorMessage:
          type: string
        creationTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time


    InstructionChildResponse:
      type: object
      description: >
        Submitted instruction fields plus the current instruction-level status
        (see *Instruction status lifecycle*). An instruction that failed
        validation has no `statusCode`; its reasons are in `errors`. This schema
        intentionally does not expose generated orders, trades, or per-asset
        execution details.
      properties:
        instructionBatchId:
          type: integer
          format: int64
        instructionId:
          type: integer
          format: int64
        portfolioId:
          type: integer
          format: int64
        instructionType:
          type: string
        amount:
          type: integer
          format: int64
        modelCode:
          type: integer
          format: int64
          description: Code of the investment model given in the instruction.
        creationTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
        statusCode:
          type: string
          description: >
            Instruction-level status. Absent for an instruction that failed
            validation.
          enum:
            - EXECUTED
            - APPROVED
            - REJECTED
            - FINALIZED
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InstructionChildErrorResponse'

    InstructionBatchRequest:
      type: object

      required:
        - instructionBatchId
        - instructionType
        - sumInvest
        - sumDivest
        - instructions

      properties:

        instructionBatchId:
          type: integer
          format: int64
          description: >
            Client-generated unique identifier of the batch request, used for
            correlation and subsequent batch lookup.

        instructionType:
          $ref: '#/components/schemas/InstructionType'

        sumInvest:
          type: integer
          format: int64
          description: >
            Total INVEST amount in the batch. It is zero for a DIVEST batch.

        sumDivest:
          type: integer
          format: int64
          description: >
            Total DIVEST amount in the batch. It is zero for an INVEST batch.

        instructions:
          type: array
          minItems: 1
          maxItems: 2147483647
          description: >
            Instructions to submit. Each item is validated independently.
            A batch may contain one or more instructions.
          items:
            $ref: '#/components/schemas/InstructionRequest'


    InstructionBatchResponse:
      type: object
      properties:
        instructionBatchId:
          type: integer
          format: int64
        statusId:
          type: integer
          format: int64
        statusCode:
          type: string
          description: Batch-level status (see *Batch status lifecycle*).
          enum:
            - PENDING
            - EXECUTING
            - PARTIALLY_COMPLETED
            - FAILED
            - APPROVED
            - REJECTED
            - FINALIZED
        statusDescription:
          type: string
        creationTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InstructionChildErrorResponse'


    PortfolioDetailsResponse:
      type: object
      properties:

        portfolioId:
          type: integer
          format: int64

        modelCode:
          type: integer
          format: int64
          description: >
            Code of the portfolio's default investment model.

        cashBalance:
          type: integer
          format: int64
          description: >
            Cash balance available in the portfolio, in Rial.

        value:
          type: integer
          format: int64
          description: >
            Total value of the portfolio, in Rial. Equal to the cash
            balance plus the market value (quantity × lastMarketPrice) of all
            asset holdings.

        assets:
          type: array
          description: >
            Current asset holdings of the portfolio.
          items:
            $ref: '#/components/schemas/PortfolioAssetDto'

        timestamp:
          type: string
          format: date-time
          description: >
            Date and time this valuation was generated, in UTC.


    PortfolioAssetDto:
      type: object
      properties:

        isin:
          type: string
          description: ISIN code of the trading symbol.
          example: IRTKMOFD0001

        symbol:
          type: string
          description: Trading symbol (short code).
          example: عیار

        quantity:
          type: integer
          format: int64
          description: >
            Number of units of the symbol currently held.

        lastMarketPrice:
          type: integer
          format: int64
          description: >
            Last known market price per unit of the symbol, in Rial.


    PortfolioNetMarketValueResponse:
      type: object
      properties:
        portfolioId:
          type: integer
          format: int64
        marketValue:
          type: integer
          format: int64
          description: Market value of the holdings, in Rial.
        cashValue:
          type: integer
          format: int64
          description: Cash balance, in Rial. Always zero while there is debt.
        debt:
          type: integer
          format: int64
          description: >
            Debt left by withdrawals larger than the cash, in Rial. Paid first
            by later deposits and sales.
        netValue:
          type: integer
          format: int64
          description: marketValue + cashValue - debt, in Rial.


    PortfolioTransactionResponse:
      type: object
      properties:

        portfolioId:
          type: integer
          format: int64

        from:
          type: string
          format: date-time
          description: Start of the requested date range (inclusive).

        to:
          type: string
          format: date-time
          description: End of the requested date range (inclusive).

        page:
          type: integer
          format: int32

        pageSize:
          type: integer
          format: int32

        totalPages:
          type: integer
          format: int32

        transactions:
          type: array
          description: >
            Transactions of the portfolio within the requested date range,
            sorted by timestamp ascending.
          items:
            $ref: '#/components/schemas/PortfolioTransaction'


    PortfolioTransaction:
      type: object
      description: >
        A single investment or portfolio transaction. trade is present only
        when type is BUY or SELL, and absent for DEPOSIT and WITHDRAWAL.

      properties:

        transactionId:
          type: integer
          format: int64
          description: Unique identifier of the transaction.

        type:
          $ref: '#/components/schemas/TransactionType'

        statusCode:
          type: string

        statusDescription:
          type: string

        amount:
          type: integer
          format: int64
          description: >
            Monetary value of the transaction, in Rial. For BUY and SELL it
            equals trade.quantity × trade.price.

        timestamp:
          type: string
          format: date-time
          description: Date and time the transaction took place, in UTC.

        trade:
          $ref: '#/components/schemas/PortfolioTrade'


    PortfolioTrade:
      type: object
      description: Trade details of a BUY or SELL transaction.

      properties:

        isin:
          type: string
          description: ISIN code of the trading symbol.
          example: IRTKMOFD0001

        symbol:
          type: string
          description: Trading symbol (short code).
          example: عیار

        symbolName:
          type: string
          description: Full name of the trading symbol.
          example: صندوق عیار مفید

        quantity:
          type: integer
          format: int64
          description: Number of units traded.

        price:
          type: integer
          format: int64
          description: Price per unit for this trade, in Rial.


    TransactionType:
      type: string
      description: |
        - `DEPOSIT`: cash added to the account.
        - `WITHDRAWAL`: cash taken out of the account.
        - `BUY`: units of an asset bought.
        - `SELL`: units of an asset sold.
      enum:
        - DEPOSIT
        - WITHDRAWAL
        - BUY
        - SELL


    InstructionType:
      type: string
      description: |
        - `INVEST`: record a cash deposit in the investment account. It pays
          any debt first.
        - `DIVEST`: record a withdrawal in the investment account. Any part
          larger than the cash becomes debt.
      enum:
        - INVEST
        - DIVEST


    ErrorResponse:
      type: object
      additionalProperties: false

      required:
        - code
        - message

      properties:

        code:
          $ref: '#/components/schemas/ErrorCode'

        message:
          type: string
          description: >
            Human-readable description of the error. Not stable; do not
            parse it.


    ErrorCode:
      type: string
      description: |
        Machine-readable error code. Clients must branch on this value
        rather than on the HTTP status.

        - `INVALID_REQUEST` (400): the request does not match the schema,
          or a path or query parameter is invalid, and no more specific
          code applies.
        - `AMOUNT_REQUIRED` (400): `amount` is missing for INVEST or DIVEST.
        - `INVALID_AMOUNT` (400): `amount` is below 1.
        - `DUPLICATE_INSTRUCTION` (400): `instructionId` already exists.
          See *Retries and idempotency*. A reused `instructionBatchId` is also
          rejected, but its specific error code must be confirmed by the API
          implementation.
        - `INVESTMENT_PLAN_NOT_FOUND` (400): `modelCode` does not
          refer to an existing model.
        - `INVESTMENT_PLAN_REQUIRED` (400): no model could be resolved,
          either because an INVEST creates a new account without
          `modelCode`, or because the account has no default model.
        - `INVESTMENT_NOT_FOUND` (400 on POST, 404 on GET): the investment
          account does not exist.
        - `INSTRUCTION_NOT_FOUND` (404): the instruction does not exist.
      enum:
        - DUPLICATE_INSTRUCTION
        - INVESTMENT_PLAN_NOT_FOUND
        - INVESTMENT_NOT_FOUND
        - INVESTMENT_PLAN_REQUIRED
        - AMOUNT_REQUIRED
        - INVALID_AMOUNT
        - INVALID_REQUEST
        - INSTRUCTION_NOT_FOUND
        - INSTRUCTION_BATCH_NOT_FOUND
