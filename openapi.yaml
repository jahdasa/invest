openapi: 3.0.3

info:
  title: Investment Instruction API
  version: 1.0.0
  description: |
    API for submitting investment instructions and retrieving
    their current financial processing status. The instruction endpoints do not expose
    generated orders, trades, or per-asset execution details.

    ## Conventions

    - **Monetary unit.** Every monetary value in this API (`amount`,
      `price`, `lastMarketPrice`, `cashBalance`,
      `value`) is an integer number of **Iranian Rial (IRR)**.
      Toman is never used.
    - **Money identity.** For an account, `value`
      equals `cashBalance` plus the sum of `quantity × lastMarketPrice` over
      its assets.
    - **Timestamps.** `date-time` values are ISO 8601 in **UTC** (suffix `Z`).
    - **Identifiers.** `instructionBatchId` groups a batch, and each
      `instructionId` is unique across all clients.
      `portfolioId` identifies the portfolio affected by an instruction.

    ## Asynchronous processing

    Instructions are submitted through `POST /instructions/batch` and are
    executed asynchronously. A valid batch receives HTTP 201 with no response
    body; it does not mean execution has completed. No push mechanism
    (webhooks or callbacks) exists. Clients track each instruction with
    `GET /instructions/{instructionBatchId}/{instructionId}`
    until it reaches a terminal status (`COMPLETED`,
    `PARTIALLY_COMPLETED`, or `FAILED`).

    ## Instruction status lifecycle

    | Status | Meaning | Terminal |
    |---|---|---|
    | `PENDING` | Accepted and stored; processing has not started yet. | No |
    | `EXECUTING` | Processing has started. | No |
    | `PARTIALLY_COMPLETED` | Processing has finished, but only part of the instruction was completed. No further execution will occur for this instruction. | Yes |
    | `COMPLETED` | The financial effect of the instruction was recorded successfully; this does not imply market execution. | Yes |
    | `FAILED` | The instruction could not be completed. | Yes |

    Transitions:

    | From | To | Trigger |
    |---|---|---|
    | `PENDING` | `EXECUTING` | Processing starts. |
    | `EXECUTING` | `COMPLETED` | Processing finishes and the instruction is completed in full. |
    | `EXECUTING` | `PARTIALLY_COMPLETED` | Processing finishes after only part of the instruction could be completed; no further execution will occur. |
    | `PENDING`, `EXECUTING` | `FAILED` | A processing or business-rule failure prevents completion. |

    ## Plans

    A plan defines a set of assets and their target weights. This version
    of the API has no plan-discovery endpoint. A plan ID in a request must
    refer to an existing plan, otherwise `INVESTMENT_PLAN_NOT_FOUND` is returned.

    ## Errors

    - `POST /instructions/batch` returns **HTTP 400** only when the batch
      request itself is malformed. Processing errors for an individual
      instruction are exposed by the instruction lookup response.
    - JSON Schema violations map to specific codes where one exists:
      a missing `amount` for INVEST or DIVEST → `AMOUNT_REQUIRED`;
      an `amount` below 1 → `INVALID_AMOUNT`. Every other
      schema violation (malformed JSON, a wrong type, a missing required
      field, an unknown property, an unknown enum value) →
      `INVALID_REQUEST`.
    - On GET endpoints, an invalid path or query parameter (non-numeric
      or below 1, a malformed `date-time`, or `from` later than `to`)
      returns HTTP 400 with `INVALID_REQUEST`.
    - The gateway can return these responses on any endpoint: 401
      (missing or invalid credentials), 403 (the client may not access
      the requested investment account), 429 (too many requests),
      500 (unexpected error) and 503 (temporarily unavailable).
      Their bodies are not guaranteed to follow `ErrorResponse`. Retry 429
      and 503 with backoff. After a 500 or a timeout on
      `POST /instructions/batch`, the outcome of individual items may be
      unknown: reconcile accepted items with
      `GET /instructions/{instructionBatchId}/{instructionId}` (see
      *Retries and idempotency*).
    - `ErrorResponse` has no trace ID and no per-field details. When
      reporting a problem, include the `code`, the request timestamp (UTC)
      and the related `instructionId`, `portfolioId`, or `investmentId`.

    ## Retries and idempotency

    `instructionId` is the idempotency key for each item in a batch. It must
    be **globally unique across all clients** and must never be reused, even
    after the instruction is terminal. `instructionBatchId` is a correlation
    identifier and is not the idempotency key.

    After a timeout or a 5xx on `POST /instructions/batch`, call
    `GET /instructions/{instructionBatchId}/{instructionId}` to determine
    whether each submitted instruction was stored before retrying.

    ## Known limitations of this version

    - Instruction endpoints expose only instruction-level status; generated
      orders, trades, and per-asset execution details are intentionally not returned.
    - There is no endpoint that lists the instructions of an investment
      account. Clients must keep the `instructionId`s they submit.

servers:
  - url: https://vestapi.emofid.com/bimehma/api/v1
    description: Production
  - url: https://vestapi-sandbox.emofid.com/bimehma/api/v1
    description: Sandbox

security:
  - bearerAuth: []

paths:

  /instructions/batch:
    post:
      operationId: submitInstructionBatch
      summary: Submit a batch of investment instructions
      description: |
        Submits one or more instructions of the batch's `instructionType` in
        a single request. `sumInvest` and `sumDivest` provide the batch totals.
        Each instruction is validated and processed independently; the failure
        or rejection of one instruction does not prevent the others from being
        accepted. A batch containing a single instruction is valid. See
        *Errors* and *Retries and idempotency* for submission and retry rules.

        A valid batch is accepted with HTTP status 201 and no response body.

        HTTP 400 is only returned when the batch request itself is
        malformed (for example, invalid JSON or a missing or empty
        `instructions` array); it does not reflect the outcome of any
        individual instruction.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionBatchRequest'

            example:
              instructionBatchId: 600004
              instructionType: INVEST
              sumInvest: 15594
              sumDivest: 0
              instructions:

                - instructionId: 10499909
                  portfolioId: 209999
                  amount: 8643
                  investmentPlanId: 100000

                - instructionId: 105000012
                  portfolioId: 210000
                  amount: 6951
                  investmentPlanId: 100000

      responses:

        '201':
          description: Created

        '400':
          description: >
            The batch request itself is malformed. Covers schema
            validation errors of the request body, such as a missing or
            empty instructions array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INVALID_REQUEST
                message: instructions must be a non-empty array.

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /instructions/batch/{instructionBatchId}:
    get:
      operationId: getInstructionBatch
      summary: Get instruction batch status
      description: >
        Returns the current batch-level status. No generated order or execution
        detail is returned. An invalid instructionBatchId returns HTTP 400 with
        INVALID_REQUEST.

      parameters:

        - name: instructionBatchId
          in: path
          required: true
          description: Unique identifier of the instruction batch
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Instruction batch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionBatchResponse'

              example:
                id: 1
                instructionBatchId: 600001
                statusId: 2
                status: COMPLETED
                statusDescription: Completed
                creationTime: '2026-09-27T10:15:00Z'
                updateTime: '2026-09-27T10:16:00Z'
                errors: []

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Instruction Batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INSTRUCTION_BATCH_NOT_FOUND
                message: Instruction batch with the specified instructionBatchId does not exist.

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /instructions/{instructionBatchId}/{instructionId}:
    get:
      operationId: getInstruction
      summary: Get instruction details and execution status
      description: >
        Returns the submitted instruction fields and its current instruction-level
        status. Generated orders, trades, and per-asset execution details are not
        returned. An invalid instructionId returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: instructionBatchId
          in: path
          required: true
          description: Identifier of the batch containing the instruction
          schema:
            type: integer
            format: int64
            minimum: 1

        - name: instructionId
          in: path
          required: true
          description: Unique identifier of the instruction
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Instruction details and current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionChildResponse'

              example:
                id: 1
                instructionBatchId: 600001
                instructionId: 100001
                portfolioId: 200001
                instructionType: INVEST
                amount: 50000000
                investmentPlanId: 300002
                status: COMPLETED
                statusDescription: Completed
                creationTime: '2026-09-27T10:15:00Z'
                updateTime: '2026-09-27T10:16:00Z'
                errors: []

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Instruction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                code: INSTRUCTION_NOT_FOUND
                message: Instruction with the specified instructionId does not exist.

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /portfolios/{portfolioId}/details:
    get:
      operationId: getPortfolioDetails
      summary: Get portfolio details
      description: >
        Returns the portfolio's default plan, cash balance, and current asset
        holdings. All monetary values are in Rial. An invalid portfolioId
        returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Portfolio details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioDetailsResponse'

              example:
                portfolioId: 112910912784151
                planId: 300002
                cashBalance: 5000000
                value: 45100000
                assets:
                  - isin: IRTKMOFD0001
                    symbol: عیار
                    quantity: 1500
                    lastMarketPrice: 13400

                  - isin: IRT3TVAF0001
                    symbol: توان
                    quantity: 800
                    lastMarketPrice: 25000
                timestamp: '2026-09-27T10:15:00Z'

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /portfolios/{portfolioId}/net-market-value:
    get:
      operationId: getPortfolioNetMarketValue
      summary: Get portfolio net market value
      description: >
        Returns the current net market value breakdown for the portfolio.
        An invalid portfolioId returns HTTP 400 with INVALID_REQUEST.

      parameters:

        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 12222122

      responses:

        '200':
          description: Current portfolio net market value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioNetMarketValueResponse'

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /portfolio-transaction/{portfolioId}/transactions:
    get:
      operationId: getPortfolioTransactions
      summary: Get transactions for a portfolio within a date range
      description: >
        Returns the requested page of portfolio transactions between the from
        and to date-times, sorted by timestamp ascending. A missing or malformed
        parameter, from later than to, or an invalid portfolioId returns HTTP
        400 with INVALID_REQUEST.

      parameters:

        - name: portfolioId
          in: path
          required: true
          description: Unique identifier of the portfolio
          schema:
            type: integer
            format: int64
            minimum: 1

        - name: from
          in: query
          required: true
          description: >
            Start of the date range (inclusive), as an ISO 8601 date-time.
            Must not be later than to.
          schema:
            type: string
            format: date-time
            example: '2026-10-01T00:00:00Z'

        - name: to
          in: query
          required: true
          description: >
            End of the date range (inclusive), as an ISO 8601 date-time.
            Must not be earlier than from.
          schema:
            type: string
            format: date-time
            example: '2026-10-12T23:59:59Z'

        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            example: 0

        - name: pageSize
          in: query
          required: false
          description: Number of transactions to return per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 20
            default: 10
            example: 10

      responses:

        '200':
          description: Portfolio transactions within the specified date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioTransactionResponse'

        '400':
          $ref: '#/components/responses/InvalidRequest'

        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '500':
          $ref: '#/components/responses/InternalServerError'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:

    InvalidRequest:
      description: A path, query, or request-body value is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_REQUEST
            message: The request contains an invalid value.

    Unauthorized:
      description: Authentication credentials are missing or invalid.

    Forbidden:
      description: The authenticated client cannot access the requested resource.

    TooManyRequests:
      description: Too many requests. Retry with backoff.

    InternalServerError:
      description: An unexpected server error occurred.

    ServiceUnavailable:
      description: The service is temporarily unavailable. Retry with backoff.

  schemas:

    InstructionRequest:
      type: object

      required:
        - instructionId
        - portfolioId
        - amount
        - investmentPlanId

      properties:

        instructionId:
          type: integer
          format: int64
          description: >
            Client-generated unique identifier of the instruction. It acts
            as the idempotency key.

            It must be globally unique across all clients. Reusing an
            existing instructionId is not allowed and returns
            DUPLICATE_INSTRUCTION, whatever the payload. After a
            DUPLICATE_INSTRUCTION on a retry, call
            GET /instructions/{instructionBatchId}/{instructionId} to check
            whether the original request succeeded.

        portfolioId:
          type: integer
          format: int64
          description: >
            Identifier of the portfolio.

            For DIVEST instructions, the portfolio must already exist.

            For INVEST instructions, a new portfolio is created with this
            identifier if it does not exist; investmentPlanId is then required.

        amount:
          type: integer
          format: int64
          description: >
            Monetary amount of the instruction, in Rial.

            INVEST: cash deposit to record in the portfolio.

            DIVEST: withdrawal/debt to record in the portfolio. It must not
            exceed the value available to sell, otherwise the instruction
            becomes FAILED.


        investmentPlanId:
          type: integer
          format: int64
          description: >
            Default investment plan of the portfolio.
            This field is required by the backoffice request contract.


    InstructionChildErrorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        instructionBatchId:
          type: integer
          format: int64
        instructionId:
          type: integer
          format: int64
        portfolioId:
          type: integer
          format: int64
        errorMessage:
          type: string
        creationTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time


    InstructionChildResponse:
      type: object
      description: >
        Submitted instruction fields plus the current instruction-level status.
        This schema intentionally does not expose generated orders, trades, or
        per-asset execution details.
      properties:
        id:
          type: integer
          format: int64
        instructionBatchId:
          type: integer
          format: int64
        instructionId:
          type: integer
          format: int64
        portfolioId:
          type: integer
          format: int64
        instructionType:
          type: string
        amount:
          type: integer
          format: int64
        investmentPlanId:
          type: integer
          format: int64
        creationTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
        status:
          type: string
        statusDescription:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InstructionChildErrorResponse'

    InstructionBatchRequest:
      type: object

      required:
        - instructionBatchId
        - instructionType
        - sumInvest
        - sumDivest
        - instructions

      properties:

        instructionBatchId:
          type: integer
          format: int64
          description: >
            Client-generated unique identifier of the batch request, used for
            correlation and subsequent batch lookup.

        instructionType:
          $ref: '#/components/schemas/InstructionType'

        sumInvest:
          type: integer
          format: int64
          description: >
            Total INVEST amount in the batch. It is zero for a DIVEST batch.

        sumDivest:
          type: integer
          format: int64
          description: >
            Total DIVEST amount in the batch. It is zero for an INVEST batch.

        instructions:
          type: array
          minItems: 1
          maxItems: 2147483647
          description: >
            Instructions to submit. Each item is validated independently.
            A batch may contain one or more instructions.
          items:
            $ref: '#/components/schemas/InstructionRequest'


    InstructionBatchResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        instructionBatchId:
          type: integer
          format: int64
        statusId:
          type: integer
          format: int64
        status:
          type: string
        statusDescription:
          type: string
        creationTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InstructionChildErrorResponse'


    PortfolioDetailsResponse:
      type: object
      properties:

        portfolioId:
          type: integer
          format: int64

        planId:
          type: integer
          format: int64
          description: >
            Default investment plan of the portfolio.

        cashBalance:
          type: integer
          format: int64
          description: >
            Cash balance available in the portfolio, in Rial.

        value:
          type: integer
          format: int64
          description: >
            Total value of the portfolio, in Rial. Equal to the cash
            balance plus the market value (quantity × lastMarketPrice) of all
            asset holdings.

        assets:
          type: array
          description: >
            Current asset holdings of the portfolio.
          items:
            $ref: '#/components/schemas/PortfolioAssetDto'

        timestamp:
          type: string
          format: date-time
          description: >
            Date and time this valuation was generated, in UTC.


    PortfolioAssetDto:
      type: object
      properties:

        isin:
          type: string
          description: ISIN code of the trading symbol.
          example: IRTKMOFD0001

        symbol:
          type: string
          description: Trading symbol (short code).
          example: عیار

        quantity:
          type: integer
          format: int64
          description: >
            Number of units of the symbol currently held.

        lastMarketPrice:
          type: integer
          format: int64
          description: >
            Last known market price per unit of the symbol, in Rial.


    PortfolioNetMarketValueResponse:
      type: object
      properties:
        portfolioId:
          type: integer
          format: int64
        marketValue:
          type: integer
          format: int64
        cashValue:
          type: integer
          format: int64
        debt:
          type: integer
          format: int64
        netBookValue:
          type: integer
          format: int64


    PortfolioTransactionResponse:
      type: object
      properties:

        portfolioId:
          type: integer
          format: int64

        from:
          type: string
          format: date-time
          description: Start of the requested date range (inclusive).

        to:
          type: string
          format: date-time
          description: End of the requested date range (inclusive).

        page:
          type: integer
          format: int32

        pageSize:
          type: integer
          format: int32

        totalPages:
          type: integer
          format: int32

        transactions:
          type: array
          description: >
            Transactions of the portfolio within the requested date range,
            sorted by timestamp ascending.
          items:
            $ref: '#/components/schemas/PortfolioTransaction'


    PortfolioTransaction:
      type: object
      description: >
        A single investment or portfolio transaction. trade is present only
        when type is BUY or SELL, and absent for DEPOSIT and WITHDRAWAL.

      properties:

        transactionId:
          type: integer
          format: int64
          description: Unique identifier of the transaction.

        type:
          $ref: '#/components/schemas/TransactionType'

        statusCode:
          type: string

        statusDescription:
          type: string

        amount:
          type: integer
          format: int64
          description: >
            Monetary value of the transaction, in Rial. For BUY and SELL it
            equals trade.quantity × trade.price.

        timestamp:
          type: string
          format: date-time
          description: Date and time the transaction took place, in UTC.

        trade:
          $ref: '#/components/schemas/PortfolioTrade'


    PortfolioTrade:
      type: object
      description: Trade details of a BUY or SELL transaction.

      properties:

        isin:
          type: string
          description: ISIN code of the trading symbol.
          example: IRTKMOFD0001

        symbol:
          type: string
          description: Trading symbol (short code).
          example: عیار

        symbolName:
          type: string
          description: Full name of the trading symbol.
          example: صندوق عیار مفید

        quantity:
          type: integer
          format: int64
          description: Number of units traded.

        price:
          type: integer
          format: int64
          description: Price per unit for this trade, in Rial.


    TransactionType:
      type: string
      description: |
        - `DEPOSIT`: cash added to the account.
        - `WITHDRAWAL`: cash taken out of the account.
        - `BUY`: units of an asset bought.
        - `SELL`: units of an asset sold.
      enum:
        - DEPOSIT
        - WITHDRAWAL
        - BUY
        - SELL


    InstructionType:
      type: string
      description: |
        - `INVEST`: record a cash deposit in the investment account.
        - `DIVEST`: record a withdrawal/debt in the investment account.
      enum:
        - INVEST
        - DIVEST


    ErrorResponse:
      type: object
      additionalProperties: false

      required:
        - code
        - message

      properties:

        code:
          $ref: '#/components/schemas/ErrorCode'

        message:
          type: string
          description: >
            Human-readable description of the error. Not stable; do not
            parse it.


    ErrorCode:
      type: string
      description: |
        Machine-readable error code. Clients must branch on this value
        rather than on the HTTP status.

        - `INVALID_REQUEST` (400): the request does not match the schema,
          or a path or query parameter is invalid, and no more specific
          code applies.
        - `AMOUNT_REQUIRED` (400): `amount` is missing for INVEST or DIVEST.
        - `INVALID_AMOUNT` (400): `amount` is below 1.
        - `DUPLICATE_INSTRUCTION` (400): `instructionId` already exists.
          See *Retries and idempotency*.
        - `INVESTMENT_PLAN_NOT_FOUND` (400): `investmentPlanId` does not
          refer to an existing plan.
        - `INVESTMENT_PLAN_REQUIRED` (400): no plan could be resolved,
          either because an INVEST creates a new account without
          `investmentPlanId`, or because the account has no default plan.
        - `INVESTMENT_NOT_FOUND` (400 on POST, 404 on GET): the investment
          account does not exist.
        - `INSTRUCTION_NOT_FOUND` (404): the instruction does not exist.
      enum:
        - DUPLICATE_INSTRUCTION
        - INVESTMENT_PLAN_NOT_FOUND
        - INVESTMENT_NOT_FOUND
        - INVESTMENT_PLAN_REQUIRED
        - AMOUNT_REQUIRED
        - INVALID_AMOUNT
        - INVALID_REQUEST
        - INSTRUCTION_NOT_FOUND
        - INSTRUCTION_BATCH_NOT_FOUND
